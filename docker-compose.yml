version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradingos-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@192.168.31.132:5432/tradingos
      - REDIS_URL=redis://192.168.31.132:6379/0
      - DEBUG=false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradingos-frontend
    ports:
      - "8081:80"
    restart: unless-stopped
