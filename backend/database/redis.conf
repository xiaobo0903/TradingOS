# ================================================
# TradingOS Redis 配置
# 用途: 实时行情缓存、热点股票缓存、任务队列
# ================================================

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 密码 (生产环境请修改)
# requirepass your_redis_password

# 数据库数量
databases 16

# 持久化策略 (生产环境建议开启)
save 900 1
save 300 10
save 60 10000

# AOF持久化
appendonly yes
appendfsync everysec

# 内存管理
maxmemory 2gb
maxmemory-policy allkeys-lru

# 键命名规范
# stock:{code}:quote        - 股票实时行情
# stock:{code}:kline:{period} - K线缓存
# market:hot:list           - 热点股票列表
# market:index              - 大盘指数
# market:limitup            - 涨停池
# rank:strong_stock         - 强势股排行
# ai:analysis:{code}        - AI分析缓存
